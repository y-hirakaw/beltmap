[package]
name = "beltmap"
version = "0.1.0"
edition = "2024"
description = "AIループ工場の構成を決定論的にスキャンし、TUIで地図として可視化する"
license = "MIT"
repository = "https://github.com/y-hirakaw/beltmap"

[dependencies]
# シリアライズ: IR / 各コレクターのレスポンス / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

# 時刻: レーンの滞留日数、ルーチンの next_run / last_fired
chrono = { version = "0.4.45", features = ["serde"] }

# エラー
anyhow = "1.0.104"
thiserror = "2.0.19"

# 推測の根拠テキストのハッシュ。ソースが変わったら推測を無効化するのに使う。
# 永続化するのでプロセス間・バージョン間で安定した値が要る
sha2 = "0.11.0"

# 端末の表示幅。日本語のラベル・機械名で桁が崩れるのを防ぐ
unicode-width = "0.2.2"

# TUI
ratatui = "0.30.2"
crossterm = "0.29.0"
