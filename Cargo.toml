[package]
name = "beltmap"
version = "0.1.0"
edition = "2024"
description = "AIループ工場の構成を決定論的にスキャンし、TUIで地図として可視化する"
license = "MIT"
repository = "https://github.com/y-hirakaw/beltmap"

[dependencies]
# シリアライズ: IR / 各コレクターのレスポンス / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"

# 時刻: レーンの滞留日数、ルーチンの next_run / last_fired
chrono = { version = "0.4.45", features = ["serde"] }

# エラー
anyhow = "1.0.104"
thiserror = "2.0.19"

# 並列コレクター (gh / REST / ファイル走査を同時に走らせる)
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "fs"] }

# TUI
ratatui = "0.30.2"
crossterm = "0.29.0"
